# ============================================================================
# nav2_params.yaml — Robot Remorque (Diff Drive + Trailer) Navigation
# ============================================================================
# Global Planner : SMAC Planner Lattice (State Lattice — diff drive primitives)
# Local Planner  : RegulatedPurePursuitController (smooth path tracking)
# Localisation   : EKF + GPS (gps_localization.launch.py — PAS AMCL)
# Recovery       : ClearCostmap → Wait → BackUp → Spin (trailer-safe order)
# ============================================================================
# NOTE: AMCL n'est PAS utilisé ici. La TF map→odom est publiée par
# ekf_filter_node_map dans gps_localization.launch.py.
# ============================================================================

# ── BEHAVIOR TREE NAVIGATOR ──────────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/local
    bt_loop_duration: 100
    default_server_timeout: 300
    transform_tolerance: 0.5
    # nav2.launch.py injects the installed trailer-recovery BT path.
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    # NOTE: default_nav_to_pose_bt_xml left empty means Nav2 uses its default
    # navigate_to_pose_w_replanning_and_recovery.xml which already has good recovery.
    # To use the custom BT, set the path after colcon build:
    # default_nav_to_pose_bt_xml: /path/to/install/diff_robot/share/diff_robot/config/navigate_to_pose_trailer_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

# ── GLOBAL PLANNER — SMAC Lattice (State Lattice) ────────────────────────────
# Uses pre-computed motion primitives for differential drive robots.
# Much better than NavfnPlanner for tractor-trailer as it respects
# kinematic constraints and produces smooth, feasible paths.
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    transform_tolerance: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      tolerance: 0.5
      use_astar: false

      # State Lattice parameters
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      resolution: 0.05

      # Differential drive motion primitives (0.5m turning radius - tighter turns)
      lattice_filepath: "/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"

      # Motion model for differential drive
      motion_model_for_search: "DIFF_DRIVE"
      minimum_turning_radius: 0.5

      # Motion primitives tuning
      allow_reverse: false
      change_penalty: 0.0
      non_straight_penalty: 1.0
      cost_penalty: 3.5
      reverse_penalty: 4.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 4.0

      # Cost-Aware heuristic
      use_cost_function_heuristic: true
      cost_penalty_weight: 1.0
      distance_penalty_weight: 1.0
      rotation_penalty_weight: 1.0

      # Search parameters
      angle_quantization_bins: 72
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true

    planner_patience: 30.0
    max_planning_retries: 20

# ── LOCAL PLANNER — Regulated Pure Pursuit ───────────────────────────────────
# Smooth path following with collision detection and velocity scaling.
# Much better than DWB for trailer systems because it produces smooth
# velocity commands that prevent trailer jackknifing.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    transform_tolerance: 2.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 45.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Trailer-safe tolerance: reachable without forcing late tight turns.
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 0.60

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- Speed ---
      desired_linear_vel: 0.26
      max_linear_accel: 0.45
      max_linear_decel: 0.80
      lookahead_dist: 0.55
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.85
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: true

      # --- Rotation in place ---
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.5

      # --- Goal approach ---
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8

      # --- Collision detection ---
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.8

      # --- Velocity scaling in curves ---
      # Slows down in tight turns to prevent trailer jackknifing
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.80
      regulated_linear_scaling_min_speed: 0.06
      cost_scaling_dist: 0.65
      cost_scaling_gain: 0.75
      inflation_cost_scaling_factor: 3.0

      # --- Other ---
      allow_reversing: false
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 1.57
      transform_tolerance: 0.2

# ── PATH SMOOTHER ────────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ── BEHAVIOR / RECOVERY SERVER ───────────────────────────────────────────────
# Recovery order for trailer: clear costmap → wait → backup → spin
# This avoids spin/backup being blocked by stale obstacle data.
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait", "drive_on_heading"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    # Reduced simulate_ahead_time — less false collision detections
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.05
    rotational_acc_lim: 1.0

# ── WAYPOINT FOLLOWER ────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

# ── VELOCITY SMOOTHER ────────────────────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.28, 0.0, 1.00]
    min_velocity: [-0.12, 0.0, -1.00]
    max_accel: [0.45, 0.0, 1.50]
    max_decel: [-0.80, 0.0, -1.50]
    odom_topic: /odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ── LOCAL COSTMAP (rolling window around robot) ──────────────────────────────
# Enlarged to 10x10m so the controller can see obstacles well ahead
# and the collision detection has proper data to work with.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      transform_tolerance: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      # Conservative straight-trailer fallback. The dynamic footprint node
      # overwrites this at runtime on /local_costmap/footprint.
      footprint: "[[0.32, 0.32], [0.32, -0.32], [-1.20, -0.32], [-1.20, 0.32]]"
      footprint_padding: 0.04
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.15
          obstacle_max_range: 4.0
          obstacle_min_range: 0.15
          # Clear obstacles immediately — prevents stale data blocking recovery
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Larger inflation makes the global path leave turn-in room.
        cost_scaling_factor: 3.0
        inflation_radius: 0.85
      always_send_full_costmap: true

# ── GLOBAL COSTMAP (full map for path planning) ─────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      transform_tolerance: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      # Same fallback; dynamic node overwrites this on /global_costmap/footprint.
      footprint: "[[0.32, 0.32], [0.32, -0.32], [-1.20, -0.32], [-1.20, 0.32]]"
      footprint_padding: 0.04
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.15
          obstacle_max_range: 4.0
          obstacle_min_range: 0.15
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.85
      always_send_full_costmap: true

# ── MAP SERVER ───────────────────────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time: true
    # Overridden by launch file
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

robot_state_publisher:
  ros__parameters:
    use_sim_time: true
