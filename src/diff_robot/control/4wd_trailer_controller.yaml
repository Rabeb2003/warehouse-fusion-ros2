controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 4WD Controller for robot base (rear + front wheels)
    robot_4wd_controller:
      type: diff_drive_controller/DiffDriveController

    # Trailer wheels controller (synced with robot)
    trailer_controller:
      type: joint_trajectory_controller/JointTrajectoryController

robot_4wd_controller:
  ros__parameters:
    # 4 roues motrices du robot : arrière + avant
    left_wheel_names: ["rear_left_joint", "front_left_joint"]
    right_wheel_names: ["rear_right_joint", "front_right_joint"]

    # Dimensions du robot
    wheel_separation: 0.40
    wheel_radius: 0.085

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: false  # robot_localization EKF publie odom -> base_footprint

    cmd_vel_timeout: 0.5

    # Limites de vitesse et d'accélération
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -1.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0

trailer_controller:
  ros__parameters:
    joints:
      - trailer_wheel_left_joint
      - trailer_wheel_right_joint
    
    command_interfaces:
      - velocity
    
    state_interfaces:
      - position
      - velocity
    
    # Trailer wheels follow robot velocity
    allow_partial_joints_goal: false
    open_loop: false
    allow_integration_in_goal: false
    
    # Velocity limits
    velocity:
      - trailer_wheel_left_joint: 2.0
      - trailer_wheel_right_joint: 2.0
    
    # Acceleration limits
    acceleration:
      - trailer_wheel_left_joint: 2.0
      - trailer_wheel_right_joint: 2.0
